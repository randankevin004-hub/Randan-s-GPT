<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07100b">
  <meta name="robots" content="noindex">
  <title>Email confirmed - Randan's GPT</title>
  <style>
    :root { color-scheme: dark; --bg:#07100b; --panel:#101b14; --text:#f1f8f2; --muted:#a9b8ad; --green:#56e76b; --lime:#c8f248; --line:#25372a; font-family:"Segoe UI",system-ui,sans-serif; }
    * { box-sizing:border-box; }
    body { display:grid; min-height:100vh; margin:0; place-items:center; padding:24px; color:var(--text); background:radial-gradient(ellipse at 75% 4%,#19351d 0,transparent 35rem),var(--bg); line-height:1.55; }
    main { width:min(100%,520px); padding:36px; border:1px solid var(--line); border-radius:20px; background:var(--panel); text-align:center; }
    h1 { margin:0 0 12px; font-size:clamp(28px,6vw,40px); letter-spacing:-.04em; }
    p { color:var(--muted); }
    a { display:inline-flex; min-height:46px; align-items:center; justify-content:center; margin-top:12px; padding:0 19px; border-radius:12px; color:#07100b; background:linear-gradient(120deg,var(--green),var(--lime)); font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <h1>Email confirmed</h1>
    <p>Your Randan's GPT account is ready. Return to the desktop app and sign in with your email and password.</p>
    <a href="./">Visit Randan's GPT</a>
  </main>
</body>
</html>
